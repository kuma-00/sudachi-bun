name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.8.1
        with:
          workspaces: sudachi-ffi -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build FFI release library
        working-directory: sudachi-ffi
        run: cargo build --release

      - name: Setup dictionary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run setup:dict -- --type core --version latest --out ./dict

      - name: Resolve dictionary path
        shell: bash
        run: |
          dict_path="$(find "$PWD/dict" -type f -name 'system_core.dic' | head -n 1)"
          if [ -z "$dict_path" ]; then
            echo "system_core.dic was not found under ./dict"
            exit 1
          fi
          echo "SUDACHI_TEST_DICT_PATH=$dict_path" >> "$GITHUB_ENV"

      - name: bun test
        run: bun test

      - name: cargo test
        working-directory: sudachi-ffi
        run: cargo test

      - name: cargo clippy
        working-directory: sudachi-ffi
        run: cargo clippy

      - name: bunx tsc --noEmit
        run: bunx tsc --noEmit

      - name: bun run biome:check
        run: bun run biome:check
